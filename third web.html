<!DOCTYPE html>
<html lang="id">
<head>

<title>Final Page</title>

}

p{
    color:#ccc;
    line-height:1.7;
}

.final{
    margin-top:25px;
    padding:18px;
    background:#111;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
}

.small{
    margin-top:25px;
    font-size:13px;
    color:#777;
}
</style>
</head>

<body>

<div class="box">

    <h1>🎉 You Made It.</h1>

    <p>
        Selamat, lu berhasil melewati seluruh rangkaian

    <div class="final">

<div class="small">
    N
</div>
